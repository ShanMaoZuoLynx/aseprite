name: Build Aseprite (Linux)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要编译的版本（留空=自动取官方最新版；也可填其他标签或分支名）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout（默认分支，仅取 workflow 文件）
        uses: actions/checkout@v4

      - name: 解析要编译的版本
        id: resolve
        shell: pwsh
        run: |
          $ref = "${{ inputs.tag }}".Trim()
          if (-not $ref) {
            $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'aseprite-ci' } -Uri 'https://api.github.com/repos/aseprite/aseprite/releases/latest'
            $ref = $rel.tag_name
          }
          "TAG=$ref" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          "VERSION=$($ref -replace '^v','')" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          Write-Host ">>> 将编译: $ref"

      - name: 检出源码（含子模块；fork 没有的标签自动从上游拉取）
        shell: pwsh
        run: |
          git fetch origin --tags --prune
          $ref = "${{ steps.resolve.outputs.TAG }}"
          if (git rev-parse -q --verify "refs/tags/$ref") {
            git checkout "refs/tags/$ref"
          } elseif (git rev-parse -q --verify "refs/remotes/origin/$ref") {
            git checkout "refs/remotes/origin/$ref"
          } else {
            git remote add upstream https://github.com/aseprite/aseprite.git
            git fetch --depth 1 upstream "refs/tags/$ref:refs/tags/$ref"
            git checkout "refs/tags/$ref"
          }
          git submodule update --init --recursive
          git log -1 --format='>>> HEAD: %h %d'

      - name: 安装 Linux 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang cmake ninja-build unzip curl libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev
          sudo apt-get install -y libegl1-mesa-dev libgles2-mesa-dev || sudo apt-get install -y libegl-dev libgles-dev

      - name: 用官方 build.sh 自动构建（自动下载配套 Skia）
        run: bash build.sh --auto --norun

      - name: 打包 tar.gz
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/bin/aseprite')) { throw 'aseprite 未生成' }
          if (-not (Test-Path 'build/bin/data')) { throw 'data 目录未生成' }
          $ver = "${{ steps.resolve.outputs.VERSION }}"
          tar -czf "aseprite-$ver-linux-x64.tar.gz" -C build/bin .

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ steps.resolve.outputs.VERSION }}-linux-x64
          path: aseprite-${{ steps.resolve.outputs.VERSION }}-linux-x64.tar.gz
          retention-days: 30
