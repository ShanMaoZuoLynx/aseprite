name: Build Aseprite (macOS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要编译的版本（留空=自动取官方最新版；也可填其他标签或分支名）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout（默认分支，仅取 workflow 文件）
        uses: actions/checkout@v4

      - name: 解析要编译的版本
        id: resolve
        shell: pwsh
        run: |
          $ref = "${{ inputs.tag }}".Trim()
          if (-not $ref) {
            $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'aseprite-ci' } -Uri 'https://api.github.com/repos/aseprite/aseprite/releases/latest'
            $ref = $rel.tag_name
          }
          "TAG=$ref" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          "VERSION=$($ref -replace '^v','')" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          Write-Host ">>> 将编译: $ref"

      - name: 检出源码（含子模块；fork 没有的标签自动从上游拉取）
        shell: pwsh
        run: |
          git fetch origin --tags --prune
          $ref = "${{ steps.resolve.outputs.TAG }}"
          if (git rev-parse -q --verify "refs/tags/$ref") {
            git checkout "refs/tags/$ref"
          } elseif (git rev-parse -q --verify "refs/remotes/origin/$ref") {
            git checkout "refs/remotes/origin/$ref"
          } else {
            git remote add upstream https://github.com/aseprite/aseprite.git
            git fetch --depth 1 upstream "refs/tags/$ref:refs/tags/$ref"
            git checkout "refs/tags/$ref"
          }
          git submodule update --init --recursive
          git log -1 --format='>>> HEAD: %h %d'

      - name: 用官方 build.sh 自动构建（自动下载配套 Skia）
        run: bash build.sh --auto --norun

      - name: 打包 .app
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/bin/Aseprite.app')) { throw 'Aseprite.app 未生成' }
          $ver = "${{ steps.resolve.outputs.VERSION }}"
          Push-Location build/bin
          zip -ry "../../aseprite-$ver-macos-arm64.zip" "Aseprite.app"
          Pop-Location

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ steps.resolve.outputs.VERSION }}-macos-arm64
          path: aseprite-${{ steps.resolve.outputs.VERSION }}-macos-arm64.zip
          retention-days: 30
