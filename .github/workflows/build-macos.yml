name: Build Aseprite (macOS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要编译的版本（留空=自动取官方最新版；也可填其他标签或分支名）'
        required: false
        default: ''
      skia_url:
        description: '（可选）手动指定 Skia 压缩包直链，留空=按版本自动匹配'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest            # Apple Silicon，自带 Xcode + clang
    timeout-minutes: 120
    steps:
      - name: Checkout（默认分支，仅取 workflow 文件）
        uses: actions/checkout@v4

      - name: 解析要编译的版本
        id: resolve
        shell: pwsh
        run: |
          $ref = "${{ inputs.tag }}".Trim()
          if (-not $ref) {
            $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'aseprite-ci' } -Uri 'https://api.github.com/repos/aseprite/aseprite/releases/latest'
            $ref = $rel.tag_name
          }
          "TAG=$ref" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          "VERSION=$($ref -replace '^v','')" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          Write-Host ">>> 将编译: $ref"

      - name: 检出源码（含子模块；fork 没有的标签自动从上游拉取）
        shell: pwsh
        run: |
          git fetch origin --tags --prune
          $ref = "${{ steps.resolve.outputs.TAG }}"
          if (git rev-parse -q --verify "refs/tags/$ref") {
            git checkout "refs/tags/$ref"
          } elseif (git rev-parse -q --verify "refs/remotes/origin/$ref") {
            git checkout "refs/remotes/origin/$ref"
          } else {
            git remote add upstream https://github.com/aseprite/aseprite.git
            git fetch --depth 1 upstream "refs/tags/$ref:refs/tags/$ref"
            git checkout "refs/tags/$ref"
          }
          git submodule update --init --recursive
          git log -1 --format='>>> HEAD: %h %d'

      - name: 获取配套当前版本的 Skia 预编译包（读官方 skia-tag.txt）
        id: skia
        shell: pwsh
        run: |
          $manual = "${{ inputs.skia_url }}".Trim()
          if ($manual) {
            "SKIA_URL=$manual" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
            Write-Host ">>> 使用手动指定的 Skia: $manual"
            exit 0
          }
          $tagFile = 'laf/misc/skia-tag.txt'
          if (-not (Test-Path $tagFile)) {
            throw '未找到 laf/misc/skia-tag.txt（子模块未检出或版本过旧）：请在 Run workflow 的 skia_url 输入框手动填 Skia 直链'
          }
          $tag = (Get-Content $tagFile -Raw).Trim()
          $url = "https://github.com/aseprite/skia/releases/download/$tag/Skia-macOS-Release-arm64.zip"
          Write-Host ">>> 官方 pin 的 Skia tag: $tag"
          "SKIA_URL=$url" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: 下载并解压 Skia
        shell: pwsh
        run: |
          $skiaDir = Join-Path $env:HOME 'deps/skia'
          $zip = Join-Path $env:RUNNER_TEMP 'skia.zip'
          Invoke-WebRequest -Uri '${{ steps.skia.outputs.SKIA_URL }}' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $skiaDir -Force
          # 兼容压缩包带一层顶层目录的情况，把内容提升到 skiaDir 根下
          $nested = Get-ChildItem $skiaDir -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'third_party') } | Select-Object -First 1
          if ($nested) {
            Write-Host ">>> 检测到嵌套顶层目录: $($nested.Name)，正在展开"
            Get-ChildItem $nested.FullName -Force | Move-Item -Destination $skiaDir -Force
            Remove-Item $nested.FullName -Recurse -Force
          }

      - name: 配置 CMake（arm64，显式路径）
        shell: pwsh
        run: |
          $skiaDir = Join-Path $env:HOME 'deps/skia'
          $libFile = Join-Path $skiaDir 'out/Release-arm64/libskia.a'
          if (-not (Test-Path $libFile)) {
            $lib = Get-ChildItem -Path $skiaDir -Recurse -Filter 'libskia.a' | Select-Object -First 1
            if (-not $lib) { throw '未找到 libskia.a，请检查 Skia 压缩包内容' }
            $libFile = $lib.FullName
          }
          $libDir = Split-Path $libFile -Parent
          Write-Host ">>> SKIA_DIR=$skiaDir"
          Write-Host ">>> SKIA_LIBRARY_DIR=$libDir"
          Write-Host ">>> SKIA_LIBRARY=$libFile"
          $sdk = (xcrun --sdk macosx --show-sdk-path)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.14 "-DCMAKE_OSX_SYSROOT=$sdk" -DLAF_BACKEND=skia "-DSKIA_DIR=$skiaDir" "-DSKIA_LIBRARY_DIR=$libDir" "-DSKIA_LIBRARY=$libFile"
          # 诊断：确认实际生效的部署目标标志（防止 -fobjc-arc 类错误）
          $minFlag = Select-String -Path 'build/build.ninja' -Pattern 'mmacosx-version-min=\S+' | Select-Object -First 1
          if ($minFlag) { Write-Host ">>> 实际部署目标标志: $($minFlag.Matches[0].Value)" }

      - name: 编译 aseprite
        run: cmake --build build --target aseprite

      - name: 打包 .app
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/bin/Aseprite.app')) { throw 'Aseprite.app 未生成' }
          $ver = "${{ steps.resolve.outputs.VERSION }}"
          Push-Location build/bin
          zip -ry "../../aseprite-$ver-macos-arm64.zip" "Aseprite.app"
          Pop-Location

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ steps.resolve.outputs.VERSION }}-macos-arm64
          path: aseprite-${{ steps.resolve.outputs.VERSION }}-macos-arm64.zip
          retention-days: 30
