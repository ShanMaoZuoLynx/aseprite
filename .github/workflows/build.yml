name: Build Aseprite (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要编译的版本（留空=自动取官方最新版；也可填其他标签或分支名）'
        required: false
        default: ''
      skia_url:
        description: '（可选）手动指定 Skia 压缩包直链，留空=按版本自动匹配'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022          # 自带 VS2022+C++、CMake、Ninja
    timeout-minutes: 90
    steps:
      - name: Checkout（默认分支，仅取 workflow 文件）
        uses: actions/checkout@v4

      # ---------- 1. 确定要编译的版本 ----------
      - name: 解析要编译的版本
        id: resolve
        shell: pwsh
        run: |
          $ref = "${{ inputs.tag }}".Trim()
          if (-not $ref) {
            $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'aseprite-ci' } -Uri 'https://api.github.com/repos/aseprite/aseprite/releases/latest'
            $ref = $rel.tag_name
          }
          "TAG=$ref" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          "VERSION=$($ref -replace '^v','')" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          Write-Host ">>> 将编译: $ref"

      # ---------- 2. 检出源码（fork 没有的标签自动从上游拉取） ----------
      - name: 检出源码（含子模块）
        shell: pwsh
        run: |
          git fetch origin --tags --prune
          $ref = "${{ steps.resolve.outputs.TAG }}"
          if (git rev-parse -q --verify "refs/tags/$ref") {
            git checkout "refs/tags/$ref"                       # fork 里已有该标签
          } elseif (git rev-parse -q --verify "refs/remotes/origin/$ref") {
            git checkout "refs/remotes/origin/$ref"             # fork 里的分支
          } else {
            git remote add upstream https://github.com/aseprite/aseprite.git
            git fetch --depth 1 upstream "refs/tags/$ref:refs/tags/$ref"   # 从上游拉取该标签
            git checkout "refs/tags/$ref"
          }
          git submodule update --init --recursive
          git log -1 --format='>>> HEAD: %h %d'

      # ---------- 3. 准备编译环境 ----------
      - name: 配置 MSVC 编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 获取配套当前版本的 Skia 预编译包
        id: skia
        shell: pwsh
        run: |
          # 1) 手动指定优先
          $manual = "${{ inputs.skia_url }}".Trim()
          if ($manual) {
            "SKIA_URL=$manual" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
            Write-Host ">>> 使用手动指定的 Skia: $manual"
            exit 0
          }
          # 2) 从当前检出的源码 INSTALL.md 读取它要求的 Skia 里程碑（如 aseprite-m124）
          $milestone = $null
          if (Test-Path 'INSTALL.md') {
            $md = Get-Content 'INSTALL.md' -Raw
            if ($md -match 'aseprite-(m\d+)') { $milestone = $matches[1] }
          }
          Write-Host ">>> 当前 Aseprite 版本要求的 Skia 里程碑: $milestone"
          # 3) 在 aseprite/skia 的 release 里找对应版本（稳定版优先，prerelease 兜底）
          $headers = @{ 'User-Agent' = 'aseprite-ci' }
          $releases = @()
          try { $releases = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/aseprite/skia/releases?per_page=10' }
          catch { Write-Host "!!! API 查询失败: $($_.Exception.Message)" }
          $pool = @($releases | Where-Object { -not $_.prerelease -and -not $_.draft }) +
                  @($releases | Where-Object { $_.prerelease -and -not $_.draft })
          $asset = $null
          if ($milestone) {
            foreach ($rel in $pool) {
              if ($rel.tag_name -match "^$milestone-") {
                $asset = $rel.assets | Where-Object {
                  $_.name -match 'windows' -and $_.name -match 'release' -and
                  $_.name -match 'x64' -and $_.name -match '\.zip$' -and $_.name -notmatch 'debug'
                } | Select-Object -First 1
                if ($asset) { Write-Host ">>> 找到配套 Skia: $($rel.tag_name) / $($asset.name)"; break }
              }
            }
          }
          # 4) 匹配不到就用最新稳定版
          if (-not $asset) {
            foreach ($rel in $pool) {
              $asset = $rel.assets | Where-Object {
                $_.name -match 'windows' -and $_.name -match 'release' -and
                $_.name -match 'x64' -and $_.name -match '\.zip$' -and $_.name -notmatch 'debug'
              } | Select-Object -First 1
              if ($asset) { Write-Host ">>> 使用最新 Skia（兜底）: $($rel.tag_name) / $($asset.name)"; break }
            }
          }
          # 5) 都没有：打印真实清单，方便排查
          if (-not $asset) {
            Write-Host '!!! 未找到匹配资产，最近 10 个 release 的实际内容：'
            foreach ($rel in $releases) {
              Write-Host "  [$($rel.tag_name)] prerelease=$($rel.prerelease)"
              foreach ($a in $rel.assets) { Write-Host "      $($a.name)" }
            }
            throw '未找到 Skia 压缩包：请打开 https://github.com/aseprite/skia/releases，把对应版本的 Skia-Windows-Release-x64.zip 直链填到 skia_url 输入框'
          }
          "SKIA_URL=$($asset.browser_download_url)" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: 下载并解压 Skia
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'skia.zip'
          Invoke-WebRequest -Uri '${{ steps.skia.outputs.SKIA_URL }}' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath 'C:\deps\skia' -Force

      # ---------- 4. 编译（与官方发行版同款配置） ----------
      - name: 配置 CMake（显式路径，不依赖环境变量展开）
        shell: pwsh
        run: |
          $skiaDir = 'C:/deps/skia'
          $libFile = Join-Path $skiaDir 'out/Release-x64/skia.lib'
          if (-not (Test-Path $libFile)) {
            $lib = Get-ChildItem -Path $skiaDir -Recurse -Filter 'skia.lib' | Select-Object -First 1
            if (-not $lib) { throw '未找到 skia.lib，请检查 Skia 压缩包内容' }
            $libFile = $lib.FullName -replace '\\','/'
          }
          $libDir = Split-Path $libFile -Parent
          Write-Host ">>> SKIA_DIR=$skiaDir"
          Write-Host ">>> SKIA_LIBRARY_DIR=$libDir"
          Write-Host ">>> SKIA_LIBRARY=$libFile"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAF_BACKEND=skia "-DSKIA_DIR=$skiaDir" "-DSKIA_LIBRARY_DIR=$libDir" "-DSKIA_LIBRARY=$libFile"

      - name: 编译 aseprite
        run: cmake --build build --target aseprite

      # ---------- 5. 打包 + 上传 ----------
      - name: 打包便携版 zip
        shell: pwsh
        run: |
          if (-not (Test-Path 'build\bin\aseprite.exe')) { throw 'aseprite.exe 未生成' }
          if (-not (Test-Path 'build\bin\data')) { throw 'data 目录未生成' }
          Compress-Archive -Path 'build\bin\*' -DestinationPath "aseprite-${{ steps.resolve.outputs.VERSION }}-win64.zip" -Force

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ steps.resolve.outputs.VERSION }}-win64
          path: build/bin
          retention-days: 30
