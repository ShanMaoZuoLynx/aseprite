name: Build Aseprite (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要编译的版本（留空=自动取官方最新版；也可填其他标签或分支名）'
        required: false
        default: ''
      skia_url:
        description: '（可选）手动指定 Skia 压缩包直链，留空=自动'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout（默认分支，仅取 workflow 文件）
        uses: actions/checkout@v4

      # ---------- 1. 确定要编译的版本 ----------
      - name: 解析要编译的版本
        id: resolve
        shell: pwsh
        run: |
          $ref = "${{ inputs.tag }}".Trim()
          if (-not $ref) {
            $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'aseprite-ci' } -Uri 'https://api.github.com/repos/aseprite/aseprite/releases/latest'
            $ref = $rel.tag_name
          }
          "TAG=$ref" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          "VERSION=$($ref -replace '^v','')" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          Write-Host ">>> 将编译: $ref"

      # ---------- 2. 检出源码：版本号样式的 ref 一律从上游拉取精确标签 ----------
      - name: 检出源码（含子模块）
        shell: pwsh
        run: |
          git fetch origin --tags --prune
          $ref = "${{ steps.resolve.outputs.TAG }}"
          if ($ref -match '^v?\d+\.\d+') {
            # 形如 v1.3.18.2 的版本号：永远用上游的精确标签，防止 fork 同名分支/标签干扰
            git remote add upstream https://github.com/aseprite/aseprite.git 2>$null
            git fetch --depth 1 upstream "refs/tags/$ref:refs/tags/$ref"
            git checkout "refs/tags/$ref"
          } elseif (git rev-parse -q --verify "refs/tags/$ref") {
            git checkout "refs/tags/$ref"                       # fork 里已有的标签
          } elseif (git rev-parse -q --verify "refs/remotes/origin/$ref") {
            git checkout "refs/remotes/origin/$ref"             # fork 里的分支
          } else {
            throw "找不到 $ref（既不是标签也不是分支）"
          }
          git submodule update --init --recursive
          # 验证版本识别（Aseprite 用 git describe 生成版本号）
          git describe --tags --always --dirty

      # ---------- 3. 写入正式版本号（模拟官方 Source zip 的做法） ----------
      - name: 写入正式版本号并禁用 git 版本覆盖
        shell: pwsh
        run: |
          $ver = "${{ steps.resolve.outputs.VERSION }}"
          $f = 'src/ver/CMakeLists.txt'
          if (-not (Test-Path $f)) { throw "未找到 $f" }
          $c = Get-Content $f -Raw
          if ($c -notmatch 'set\(VERSION "1\.x-dev"\)') { throw 'src/ver/CMakeLists.txt 格式与预期不符，请检查' }
          $c = $c -replace 'set\(VERSION "1\.x-dev"\)', "set(VERSION `"$ver`")"
          $c = $c -replace 'option\(UPDATE_VERSION_WITH_GIT "Update Aseprite version using Git commit" on\)', 'option(UPDATE_VERSION_WITH_GIT "Update Aseprite version using Git commit" off)'
          Set-Content -Path $f -Value $c -Encoding utf8NoBOM
          Write-Host ">>> 已写入版本号: $ver"
          Select-String -Path $f -Pattern 'set\(VERSION|UPDATE_VERSION_WITH_GIT' | ForEach-Object { Write-Host "   $($_.Line.Trim())" }

      # ---------- 4. 准备编译环境 ----------
      - name: 配置 MSVC 编译环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 获取配套当前版本的 Skia 预编译包（读官方 skia-tag.txt）
        id: skia
        shell: pwsh
        run: |
          $manual = "${{ inputs.skia_url }}".Trim()
          if ($manual) {
            "SKIA_URL=$manual" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
            Write-Host ">>> 使用手动指定的 Skia: $manual"
            exit 0
          }
          $tagFile = 'laf/misc/skia-tag.txt'
          if (-not (Test-Path $tagFile)) {
            throw '未找到 laf/misc/skia-tag.txt（子模块未检出或版本过旧）：请在 Run workflow 的 skia_url 输入框手动填 Skia 直链'
          }
          $tag = (Get-Content $tagFile -Raw).Trim()
          $url = "https://github.com/aseprite/skia/releases/download/$tag/Skia-Windows-Release-x64.zip"
          Write-Host ">>> 官方 pin 的 Skia tag: $tag"
          "SKIA_URL=$url" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: 下载并解压 Skia
        shell: pwsh
        run: |
          $skiaDir = 'C:\deps\skia'
          $zip = Join-Path $env:RUNNER_TEMP 'skia.zip'
          Invoke-WebRequest -Uri '${{ steps.skia.outputs.SKIA_URL }}' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $skiaDir -Force

      # ---------- 5. 编译（官方 INSTALL.md 同款配置） ----------
      - name: 配置 CMake（显式路径）
        shell: pwsh
        run: |
          $skiaDir = 'C:/deps/skia'
          $libFile = Join-Path $skiaDir 'out/Release-x64/skia.lib'
          if (-not (Test-Path $libFile)) {
            $lib = Get-ChildItem -Path $skiaDir -Recurse -Filter 'skia.lib' | Select-Object -First 1
            if (-not $lib) { throw '未找到 skia.lib，请检查 Skia 压缩包内容' }
            $libFile = $lib.FullName -replace '\\','/'
          }
          $libDir = Split-Path $libFile -Parent
          Write-Host ">>> SKIA_DIR=$skiaDir"
          Write-Host ">>> SKIA_LIBRARY_DIR=$libDir"
          Write-Host ">>> SKIA_LIBRARY=$libFile"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAF_BACKEND=skia "-DSKIA_DIR=$skiaDir" "-DSKIA_LIBRARY_DIR=$libDir" "-DSKIA_LIBRARY=$libFile"

      - name: 编译 aseprite
        run: cmake --build build --target aseprite

      # ---------- 6. 检查依赖 + 版本断言 + 打包 ----------
      - name: 检查运行依赖、验证版本并打包
        shell: pwsh
        run: |
          if (-not (Test-Path 'build\bin\aseprite.exe')) { throw 'aseprite.exe 未生成' }
          if (-not (Test-Path 'build\bin\data')) { throw 'data 目录未生成' }
          $ver = "${{ steps.resolve.outputs.VERSION }}"

          # 1) 动态依赖
          & dumpbin /dependents 'build\bin\aseprite.exe' | Select-String '\.dll' | ForEach-Object { Write-Host ">>> 依赖 DLL: $($_.Line.Trim())" }

          # 2) 打包 OpenSSL 运行库（构建机预装 OpenSSL 3，exe 动态链接了它）
          foreach ($b in @('C:\Program Files\OpenSSL\bin', 'C:\Program Files\OpenSSL-Win64\bin')) {
            if (Test-Path $b) {
              Copy-Item (Join-Path $b 'libcrypto-3-x64.dll') 'build\bin\' -Force -ErrorAction SilentlyContinue
              Copy-Item (Join-Path $b 'libssl-3-x64.dll') 'build\bin\' -Force -ErrorAction SilentlyContinue
            }
          }
          Get-ChildItem 'build\bin\*.dll' | ForEach-Object { Write-Host ">>> 已打包 DLL: $($_.Name)" }

          # 3) 版本断言：必须显示正式版本号（和官方发行版一致）
          $verOut = (& 'build\bin\aseprite.exe' --version 2>&1 | Out-String).Trim()
          Write-Host ">>> aseprite --version => $verOut"
          if ($LASTEXITCODE -ne 0) { throw 'aseprite.exe 启动失败（退出码非 0）' }
          if ($verOut -and $verOut -notmatch [regex]::Escape("v$ver")) {
            throw "版本号异常：期望 v$ver，实际: $verOut"
          }

          # 4) 打包
          Compress-Archive -Path 'build\bin\*' -DestinationPath "aseprite-$ver-win64.zip" -Force

      # ---------- 7. 上传 Artifact ----------
      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ steps.resolve.outputs.VERSION }}-win64
          path: build/bin
          retention-days: 30
